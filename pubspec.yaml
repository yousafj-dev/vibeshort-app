name: vibeshort
description: "VibeShort - short video app. Feel the vibe."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  video_player: ^2.9.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  dio: ^5.7.0
  share_plus: ^10.0.0
  # Fix round: save downloaded videos to the device gallery.
  gal: ^2.3.0
  # Editing phase: in-app camera recording (pinned for Flutter 3.27.4 / Dart 3.6)
  camera: 0.11.1
  # Editing phase: real video processing (filters / effects / trim /
  # music mix / text overlay). Maintained fork — the official
  # ffmpeg_kit_flutter is retired.
  ffmpeg_kit_flutter_new: 4.6.7
  # Editing phase: pick a music file from the device (Flutter 3.27-compatible)
  file_picker: 8.3.7
  path_provider: 2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    # Font used by FFmpeg drawtext for the text overlay.
    - assets/fonts/DejaVuSans-Bold.ttf
