name: Build VibeShort APK

# Push-based route: full Flutter source lives at the repo root.
# On every push to main, builds a release APK on GitHub's servers and
# publishes it as a Release so it can be downloaded as a plain .apk
# on a phone (no artifact/zip handling needed).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Publish APK as a release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-apk-${{ github.run_number }}
          name: VibeShort test APK #${{ github.run_number }}
          body: |
            Test build of VibeShort (short video app) — Editing phase:
            filters, effects, trim and music for every video.
            Record in the app's own camera and the look is LIVE over
            the preview: all 20 colour filters and the grade effects
            tint the camera feed in real time (Cinematic also shows
            its letterbox bars, Frame its white border); structural
            effects that can't render live on a camera feed say so
            on screen and are applied exactly at post time. Gallery
            clips get the same live-look preview on the edit screen,
            plus trim (start/end sliders, the preview loops the kept
            segment), device-music mix or mute, and text overlay with
            position control. On Post, FFmpeg bakes the exact
            filter/effect chain, trim, music and text into the
            uploaded video (20 filters, 25 effects); with no edits
            the original file uploads untouched, and if processing
            fails the unedited file is never silently posted.
            Everything from Phase 4 stays: Admin panel + safety
            (reports, block, suspend, moderation, withdrawal
            review), Wallet with the ledger and referral codes,
            5-tab navigation, Discover, Inbox, Following | For You.
            Install steps: uninstall any old VibeShort build first if one
            is installed, then install this APK and allow "Install unknown
            apps" when asked.
          files: build/app/outputs/flutter-apk/app-release.apk
