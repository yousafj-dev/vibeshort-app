name: Build VibeShort APK

# Push-based route: full Flutter source lives at the repo root.
# On every push to main, builds a release APK on GitHub's servers and
# publishes it as a Release so it can be downloaded as a plain .apk
# on a phone (no artifact/zip handling needed).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Publish APK as a release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-apk-${{ github.run_number }}
          name: VibeShort test APK #${{ github.run_number }}
          body: |
            Test build of VibeShort (short video app) — NEW:
            COINS EARNING SYSTEM (Invite & Earn). A new
            "Invite & Earn" screen (top of the profile menu,
            and a button inside the Wallet) shows your coin
            balance (1,000 coins = Rs 100), your invite code
            with copy + Share buttons, friends-joined stats,
            and the full Earning Policy. HOW COINS ARE EARNED:
            invite a friend — when they sign up with your code
            AND watch their first video, you get +100 coins and
            they get +50 welcome coins; daily check-in +10
            coins (claim button on the Earn screen, once a
            day); watching a video to the end +2 coins, up to
            50 coins a day. Every coin goes through the Wallet
            ledger (Invite reward / Welcome bonus / Daily
            check-in / Watch reward) so balances stay
            checkable. HONEST POLICY, shown in the app: coins
            are collected now; cash withdrawals (minimum
            Rs 500 = 5,000 coins, Easypaisa / JazzCash) open
            only AFTER the Play Store launch, from ad revenue
            — earnings are never guaranteed. Withdrawal
            requests still just record as Pending review, as
            before. Everything from before stays: login that
            survives closing the app from Recents (one last
            login may be asked after installing), hold-to-
            record with slide zoom, exposure locked so the
            preview does not go dark when recording starts,
            gesture-only zoom, the 10 face stickers (Shades,
            Crown, Stars, Flowers, Dog, Cat, Bunny, Stache,
            Cap, Halo) tracking during recording and baked
            into posted videos, TikTok-style sound pages and
            "Use this sound", TikTok-style camera with 30 live
            looks, own-video actions (Download / Pin / Edit
            captions / Delete), feed long-press menu, Settings
            Wallet entry, 12 built-in royalty-free sounds,
            tap-Home and pull-down feed refresh, Admin panel +
            safety, Wallet with ledger and referrals, 5-tab
            navigation, Discover, Inbox, Following | For You.
            Install steps: uninstall any old VibeShort build first if one
            is installed, then install this APK and allow "Install unknown
            apps" when asked.
          files: build/app/outputs/flutter-apk/app-release.apk
