name: Build VibeShort APK

# Push-based route: full Flutter source lives at the repo root.
# On every push to main, builds a release APK on GitHub's servers and
# publishes it as a Release so it can be downloaded as a plain .apk
# on a phone (no artifact/zip handling needed).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Publish APK as a release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-apk-${{ github.run_number }}
          name: VibeShort test APK #${{ github.run_number }}
          body: |
            Test build of VibeShort (short video app) — Phase 4:
            Safety layer + Admin panel (blueprint Sections 5, 8, 9).
            Report any video (More menu on the feed) or any user
            (menu on their profile) with a reason; block a creator
            and their videos leave your feeds. Accounts whose
            Firestore role is 'admin' get an Admin panel (Profile /
            Settings): dashboard totals, reports queue with
            Resolve/Dismiss (decision reason recorded), video
            moderation (Keep/Remove), user suspend/restore with a
            recorded reason, withdrawal review (approve with a
            provider reference / reject — balances move only
            through ledger entries), referral controls, a
            maintenance-notice setting, and a read-only audit log of
            every admin action. Suspended accounts see a clear
            suspended screen and cannot post.
            Everything from Phase 3 stays: Wallet with the ledger,
            withdrawal requests, referral codes, 5-tab navigation,
            Discover, Inbox, Following | For You.
            Install steps: uninstall any old VibeShort build first if one
            is installed, then install this APK and allow "Install unknown
            apps" when asked.
          files: build/app/outputs/flutter-apk/app-release.apk
