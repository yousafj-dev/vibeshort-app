name: Build VibeShort APK

# Push-based route: full Flutter source lives at the repo root.
# On every push to main, builds a release APK on GitHub's servers and
# publishes it as a Release so it can be downloaded as a plain .apk
# on a phone (no artifact/zip handling needed).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Publish APK as a release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-apk-${{ github.run_number }}
          name: VibeShort test APK #${{ github.run_number }}
          body: |
            NEW IN THIS BUILD (test-apk-20): VibeShort now runs
            under its OWN registered Firebase Android identity.
            On Nov 9, 2026 com.vibeshort.app was registered in the
            Firebase console (nickname "VibeShort") and the app's
            FirebaseOptions now use that registration's appId and
            apiKey. Before this build the app was running under
            the Android appId registered for com.chaska.app plus
            an apiKey that is not in this project's current
            google-services.json — the leading explanation for
            why login never survived an app restart. Nothing else
            changed: same accounts, same data, same features.
            RETEST: install, log in once, then close and reopen
            the app 2-3 times (including clearing it from
            Recents) — it should go straight to the feed.
          files: build/app/outputs/flutter-apk/app-release.apk
