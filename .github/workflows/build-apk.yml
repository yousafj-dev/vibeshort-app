name: Build VibeShort APK

# Push-based route: full Flutter source lives at the repo root.
# On every push to main, builds a release APK on GitHub's servers and
# publishes it as a Release so it can be downloaded as a plain .apk
# on a phone (no artifact/zip handling needed).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Publish APK as a release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-apk-${{ github.run_number }}
          name: VibeShort test APK #${{ github.run_number }}
          body: |
            Test build of VibeShort (short video app) — Fix
            round 3. FIXED (login): closing the app from Recents
            no longer logs you out — the app now runs under a
            registered Android app identity (the native session
            store needs one), the start-up gate restores a
            lagging session instead of bouncing to login, and a
            slow connection can no longer sign you out. You may
            be asked to log in ONE last time after installing;
            after that it should stick. NEW (record button):
            press and HOLD to record Snapchat-style — slide the
            held finger up to zoom in, down to zoom out, and
            let go to stop. A quick tap still works the old way
            (tap to start, tap to stop). Everything from fix
            round 2 stays: the preview no longer goes dark when
            you tap record (exposure is locked at the preview's
            brightness), zoom is gestures only (the - / + buttons
            are gone), and the 10 face stickers (Shades, Crown,
            Stars, Flowers, Dog, Cat, Bunny, Stache, Cap, Halo)
            keep tracking while you record and are baked into
            the posted video where you saw them.
            Your filter/effect also stays visible on screen the
            whole time you record.
            Everything from before stays: TikTok-style sound
            pages and "Use this sound", TikTok-style camera with
            30 live looks and post-applied structural effects,
            own-video actions (Download / Pin / Edit captions /
            Delete), feed long-press menu, Settings Wallet entry,
            12 built-in royalty-free sounds, tap-Home and
            pull-down feed refresh, Admin panel + safety, Wallet
            with ledger and referrals, 5-tab navigation, Discover,
            Inbox, Following | For You.
            Install steps: uninstall any old VibeShort build first if one
            is installed, then install this APK and allow "Install unknown
            apps" when asked.
          files: build/app/outputs/flutter-apk/app-release.apk
