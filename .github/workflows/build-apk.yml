name: Build VibeShort APK

# Push-based route: full Flutter source lives at the repo root.
# On every push to main, builds a release APK on GitHub's servers and
# publishes it as a Release so it can be downloaded as a plain .apk
# on a phone (no artifact/zip handling needed).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Publish APK as a release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-apk-${{ github.run_number }}
          name: VibeShort test APK #${{ github.run_number }}
          body: |
            NEW IN THIS BUILD (test-apk-19): A FORENSIC FIX ROUND
            from the test-apk-18 phone retest. (1) LOGIN STILL
            ASKED AGAIN AND AGAIN + A ~10-SECOND "Restoring your
            session…" WAIT — the whole auth flow was audited and
            rebuilt on the standard pattern. What the audit
            found: the ONLY automatic route to the login screen
            is the splash; every other trip there follows an
            explicit Log out / Delete tap; nothing in the app
            signs the user out behind his back; and the ~10s
            wait was AuthService's old 12-second restore window
            expiring as signed-out (its expiry also wiped the
            session marker, making the failure permanent). That
            window is GONE. Auth now resolves from
            FirebaseAuth.currentUser + the first authStateChanges
            event, with at most a 3-second fuse in the
            marker-present case — and a timeout can never wipe
            the session marker again. The Firebase init retry
            also no longer deletes the default app (deleting it
            can destroy the persisted session store). Honest
            note: if the sign-in still does not survive on a
            given phone after this build, the remaining suspect
            sits in the Firebase console identity (the shared
            project's API key / interim appId), not in this
            code — the app now records a diagnostic counter for
            exactly that case. (2) FEED SCROLL FELT JAMMED /
            SLOW — the pager now pre-builds the previous and
            next pages, so the next video's player initialises
            and buffers while you watch the current one instead
            of starting cold at the swipe; while a player loads,
            the video's own first-frame picture fills the screen
            instead of a black spinner; cards repaint in
            isolation. The look and every feature (progress
            line, shuffle, pull-down refresh popup, overlays)
            are unchanged. Everything from test-apk-18 stays:
            pull-down-only refresh with the top popup
            ("Refreshing…" → "Feed refreshed — new videos"),
            the bigger/bolder white "+" on the black create
            button. Everything from test-apk-17 stays (feed
            freshness: per-session shuffle, a reopen never
            starts on the same video when the pool offers an
            alternative; the Following tab stays newest-first),
            and everything from test-apk-16 stays: (1) New logo —
            Logo 1 "Play-V" is now the launcher icon and the
            in-app logo (splash + login). (2) Animated splash:
            the V draws in, the play triangle pops with a glow,
            the name fades in, then the logo zooms into the app
            (tap to skip). (3) Feed progress line: a thin
            pink-to-violet line at the very bottom of the video
            feed fills as each video plays. (4) The middle "+"
            create button is now solid black. (5) Dark / Light
            mode: Settings → Appearance → Theme (Dark stays the
            default; the choice is remembered on the device).
            Everything else identical to test-apk-15.
            Test build of VibeShort (short video app) — NEW:
            COINS EARNING SYSTEM (Invite & Earn). A new
            "Invite & Earn" screen (top of the profile menu,
            and a button inside the Wallet) shows your coin
            balance (1,000 coins = Rs 100), your invite code
            with copy + Share buttons, friends-joined stats,
            and the full Earning Policy. HOW COINS ARE EARNED:
            invite a friend — when they sign up with your code
            AND watch their first video, you get +100 coins and
            they get +50 welcome coins; daily check-in +10
            coins (claim button on the Earn screen, once a
            day); watching a video to the end +2 coins, up to
            50 coins a day. Every coin goes through the Wallet
            ledger (Invite reward / Welcome bonus / Daily
            check-in / Watch reward) so balances stay
            checkable. HONEST POLICY, shown in the app: coins
            are collected now; cash withdrawals (minimum
            Rs 500 = 5,000 coins, Easypaisa / JazzCash) open
            only AFTER the Play Store launch, from ad revenue
            — earnings are never guaranteed. Withdrawal
            requests still just record as Pending review, as
            before. Everything from before stays: login that
            survives closing the app from Recents (one last
            login may be asked after installing), hold-to-
            record with slide zoom, exposure locked so the
            preview does not go dark when recording starts,
            gesture-only zoom, the 10 face stickers (Shades,
            Crown, Stars, Flowers, Dog, Cat, Bunny, Stache,
            Cap, Halo) tracking during recording and baked
            into posted videos, TikTok-style sound pages and
            "Use this sound", TikTok-style camera with 30 live
            looks, own-video actions (Download / Pin / Edit
            captions / Delete), feed long-press menu, Settings
            Wallet entry, 12 built-in royalty-free sounds,
            tap-Home and pull-down feed refresh, Admin panel +
            safety, Wallet with ledger and referrals, 5-tab
            navigation, Discover, Inbox, Following | For You.
            Install steps: uninstall any old VibeShort build first if one
            is installed, then install this APK and allow "Install unknown
            apps" when asked.
          files: build/app/outputs/flutter-apk/app-release.apk
